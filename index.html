<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFC To-Do List</title>
    <style>
      :root {
        color-scheme: light;
        --bg-start: #eef2ff;
        --bg-end: #f8fafc;
        --card: rgba(255, 255, 255, 0.94);
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --primary: #4f46e5;
        --primary-strong: #4338ca;
        --success: #16a34a;
        --danger: #dc2626;
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      }

      .app-shell {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      .app-card {
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 28px;
        padding: 24px;
        background: var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0;
        color: var(--primary);
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.05;
      }

      .subtitle {
        margin: 0;
        max-width: 38rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .todo-form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        margin-bottom: 20px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .todo-input {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 15px 18px;
        font: inherit;
        color: var(--text);
        background: #fff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .todo-input:focus {
        outline: none;
        border-color: rgba(79, 70, 229, 0.6);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      button {
        border: 0;
        border-radius: 16px;
        font: inherit;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
        transform: none;
      }

      .primary-button {
        padding: 0 22px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .filter-button,
      .clear-button {
        padding: 10px 14px;
        color: var(--muted);
        background: #f8fafc;
      }

      .filter-button.is-active {
        color: #fff;
        background: var(--primary);
      }

      .clear-button {
        color: var(--danger);
      }

      .todo-list {
        display: grid;
        gap: 12px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .todo-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(248, 250, 252, 0.8);
      }

      .todo-checkbox {
        width: 1.2rem;
        height: 1.2rem;
        margin: 0;
        accent-color: var(--success);
      }

      .todo-text {
        min-width: 0;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .todo-item.is-complete .todo-text {
        color: var(--muted);
        text-decoration: line-through;
      }

      .delete-button {
        padding: 10px 14px;
        color: var(--danger);
        background: #fee2e2;
      }

      .empty-state {
        padding: 40px 16px;
        border: 1px dashed var(--border);
        border-radius: 18px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.7);
      }

      .status-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 640px) {
        .app-shell {
          padding-top: 16px;
        }

        .app-card {
          padding: 18px;
          border-radius: 24px;
        }

        .todo-form {
          grid-template-columns: 1fr;
        }

        .primary-button {
          min-height: 52px;
        }

        .toolbar,
        .status-bar {
          align-items: stretch;
          flex-direction: column;
        }

        .filters {
          width: 100%;
        }

        .filter-button,
        .clear-button {
          flex: 1 1 auto;
          text-align: center;
        }

        .todo-item {
          grid-template-columns: auto 1fr;
        }

        .delete-button {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="app-card" aria-labelledby="app-title">
        <header class="hero">
          <p class="eyebrow">CFC</p>
          <h1 id="app-title">To-Do List</h1>
          <p class="subtitle">
            Keep your tasks in one place. Everything is saved automatically in your browser.
          </p>
        </header>

        <form class="todo-form" id="todo-form">
          <label class="sr-only" for="todo-input">Add a task</label>
          <input
            class="todo-input"
            id="todo-input"
            type="text"
            name="task"
            maxlength="160"
            placeholder="Add a new task"
            autocomplete="off"
            required
          />
          <button class="primary-button" type="submit">Add task</button>
        </form>

        <section class="toolbar" aria-label="Task controls">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
        </section>

        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

        <footer class="status-bar">
          <span id="task-summary">0 tasks</span>
          <span id="task-meta">0 remaining</span>
        </footer>
      </section>
    </main>

    <script src="assets/js/bundle.js"></script>
  </body>
</html>
